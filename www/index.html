<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LinkVault - Offline-first bookmark manager">
  <meta name="theme-color" content="#0A0A0A">
  <title>LinkVault</title>

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">

  <!-- Preconnect to fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- App Container -->
  <div id="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header__container">
        <div class="header__logo">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-bookmark"></use>
          </svg>
          <h1 class="header__title">LinkVault</h1>
        </div>
        <div class="header__actions">
          <button class="icon-button" id="settingsBtn" aria-label="Settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-settings"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Dynamic content will be rendered here -->
    </main>

    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
      <a href="#/" class="nav-link" data-page="home" data-navigo>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-home"></use>
        </svg>
        <span class="nav-link__label">Home</span>
      </a>
      <a href="#/add" class="nav-link nav-link--primary" data-page="add" data-navigo>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-add"></use>
        </svg>
        <span class="nav-link__label">Tambah</span>
      </a>
      <a href="#/categories" class="nav-link" data-page="categories" data-navigo>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-folder"></use>
        </svg>
        <span class="nav-link__label">Categories</span>
      </a>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal__header">
          <h2 class="modal__title" id="modalTitle"></h2>
          <button class="icon-button modal__close" id="modalClose" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-close"></use>
            </svg>
          </button>
        </div>
        <div class="modal__content" id="modalContent"></div>
        <div class="modal__actions" id="modalActions"></div>
      </div>
    </div>
  </div>

  <!-- SVG Icons Sprite -->
  <svg style="display: none;">
    <!-- Home Icon -->
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </symbol>

    <!-- Search Icon -->
    <symbol id="icon-search" viewBox="0 0 24 24">
      <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </symbol>

    <!-- Settings/Gear Icon -->
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </symbol>

    <!-- Add/Plus Icon -->
    <symbol id="icon-add" viewBox="0 0 24 24">
      <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </symbol>

    <!-- Folder Icon -->
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path fill="currentColor" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
    </symbol>

    <!-- Bookmark Icon -->
    <symbol id="icon-bookmark" viewBox="0 0 24 24">
      <path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
    </symbol>

    <!-- Edit/Pencil Icon -->
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
    </symbol>

    <!-- Delete/Trash Icon -->
    <symbol id="icon-delete" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
    </symbol>

    <!-- Chevron/Down Arrow Icon -->
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
    </symbol>

    <!-- Share Icon -->
    <symbol id="icon-share" viewBox="0 0 24 24">
      <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
    </symbol>

    <!-- External Link Icon -->
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path fill="currentColor" d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
    </symbol>

    <!-- Close/X Icon -->
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </symbol>

    <!-- Back Arrow Icon -->
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </symbol>

    <!-- Three-dot Menu Icon -->
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    </symbol>

    <!-- Star/Favorite Icon -->
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
    </symbol>
  </svg>

  <!-- JavaScript Files -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/models.js"></script>
  <script src="js/router.js"></script>
  <script src="js/controllers.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
